[project]
name = "piphi-network-sonos"
version = "0.1.2"
description = "Local Sonos speaker integration for PiPhi Network."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "piphi-runtime-kit-python>=0.8.0,<1.0.0",
  "soco>=0.31.2,<0.32.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "piphi-runtime-testkit-python>=0.1.0,<1.0.0",
]


[project.scripts]
piphi_network_sonos = "piphi_network_sonos.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piphi_network_sonos"]
